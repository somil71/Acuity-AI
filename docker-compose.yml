version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - hospital_data:/app
    environment:
      - DATABASE_URL=sqlite:///./hospital.db
      - SECRET_KEY=demo_secret_key_change_in_prod

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  hospital_data:
